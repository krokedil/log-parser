name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # krokedil/wp-api is private. WP_API_TOKEN is a GitHub token that can read it.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.WP_API_TOKEN }}"}}'

      - name: Tests
        run: composer test

      - name: Coding standards
        run: composer cs-check
